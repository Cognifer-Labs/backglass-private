[package]
name = "backglass-desktop"
version = "0.1.0"
description = "Backglass — commitment ledger dashboard, desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Window size and position across launches — the one macOS behaviour the shell was
# missing that a plugin owns rather than the builder.
tauri-plugin-window-state = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
