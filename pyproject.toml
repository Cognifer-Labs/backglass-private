[project]
name = "backglass"
version = "0.1.0"
description = "A commitment ledger with documents as evidence."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.32",
    "pypdf>=6.14.2",
    "anthropic>=0.120.2",
]

[project.scripts]
backglass = "backglass.__main__:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    # Starlette's TestClient needs an httpx-family client. Dev-only: nothing in
    # backglass/ imports it, and no production path depends on it.
    "httpx2>=0.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backglass"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. `Depends()` in a default IS FastAPI's
# dependency-injection idiom, and the alternative the rule suggests — a module-level
# singleton — would be a real bug here, because each request needs its own connection.
"backglass/web/app.py" = ["B008"]
"backglass/web/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backglass"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.*", "instagrapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-x --tb=short"
testpaths = ["tests"]
# evals/ is deliberately excluded. Evals call a live model, are not pass/fail,
# and must never gate CI. See docs/10 §Testing.
