<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="Backglass">
  <title>Backglass</title>
  <desc>Wordmark. A beige band cut diagonally through a black plate, condensed uppercase. Colors from design/tokens.css.</desc>

  <rect x="0" y="0" width="640" height="210" fill="#FAF3DF"/>

  <!-- plate -->
  <g>
    <rect x="4" y="4" width="632" height="146" fill="#FAF3DF"/>
    <!-- top wedge -->
    <polygon points="4,4 636,4 636,20 4,50" fill="#000000"/>
    <!-- bottom wedge -->
    <polygon points="4,126 636,96 636,150 4,150" fill="#000000"/>
    <!-- name, set along the diagonal band -->
    <text x="320" y="73" transform="rotate(-2.72 320 73)"
          text-anchor="middle" dominant-baseline="central"
          font-family="'Helvetica Neue Condensed','HelveticaNeue-CondensedBold','Arial Narrow',system-ui,sans-serif"
          font-weight="700" font-size="54" letter-spacing="2" fill="#000000">BACKGLASS</text>
    <rect x="4" y="4" width="632" height="146" fill="none" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- credit bar -->
  <rect x="4" y="162" width="632" height="44" fill="#000000"/>
  <text x="24" y="192"
        font-family="'Helvetica Neue Condensed','Arial Narrow',system-ui,sans-serif"
        font-weight="700" font-size="24" letter-spacing="0.6" fill="#FAF3DF">MFD. BY BACKGLASS LABS</text>

  <!-- score reel: black housing, paper wheels — constant in both modes -->
  <g transform="translate(502 170)">
    <rect x="0" y="0" width="116" height="28" fill="#000000" stroke="#FAF3DF" stroke-width="2"/>
    <rect x="5" y="4" width="24" height="20" rx="2" fill="#FAF3DF"/>
    <rect x="33" y="4" width="24" height="20" rx="2" fill="#FAF3DF"/>
    <rect x="61" y="4" width="24" height="20" rx="2" fill="#FAF3DF"/>
    <rect x="89" y="4" width="22" height="20" rx="2" fill="#FAF3DF"/>
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-weight="700" font-size="15" fill="#000000" text-anchor="middle">
      <text x="17" y="19">0</text>
      <text x="45" y="19">6</text>
      <text x="73" y="19">0</text>
      <text x="100" y="19">0</text>
    </g>
  </g>
</svg>
